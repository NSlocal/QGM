name: Buat Certificate & Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java + OpenSSL
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ✅ BUAT SEMUA FILE CERT + KEYSTORE
        run: |
          mkdir -p cert-output
          cd cert-output

          # 🔑 Buat Keystore APK
          keytool -genkeypair -v \
            -keystore app-release-key.jks \
            -alias release-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass QGMstore123 \
            -keypass QGMkey123 \
            -dname "CN=QGM, O=NSlocal, L=Pekanbaru, ST=Riau, C=ID" \
            -sigalg SHA256withRSA

          # 📄 Export CERT SAJA (tanpa key) — untuk Install CA Certificate ✅
          keytool -exportcert -alias release-key -keystore app-release-key.jks \
            -storepass QGMstore123 -rfc -file QGM-CA-CERT-ONLY.pem

          keytool -exportcert -alias release-key -keystore app-release-key.jks \
            -storepass QGMstore123 -file QGM-CA-CERT-ONLY.cer

          # 📦 Buat ZIP SEMUA
          zip QGM-CERT-FULL.zip QGM-CA-CERT-ONLY.pem QGM-CA-CERT-ONLY.cer app-release-key.jks
          ls -la
          echo "✅ SUDAH JADI! Download ZIP → pilih CA certificate → install QGM-CA-CERT-ONLY.cer / .pem"

      - name: 📦 Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: QGM-CERT-FULL-PACKAGE
          path: cert-output/QGM-CERT-FULL.zip
