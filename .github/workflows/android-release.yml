name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Wrapper
        shell: bash
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Check Gradle version
        run: ./gradlew --version

      - name: Clean
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Decode signing keystore
        if: ${{ env.HAS_KEYSTORE != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build Release APK
        if: ${{ env.HAS_KEYSTORE != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Prepare Release
        shell: bash
        run: |
          mkdir -p release

          find app/build/outputs/apk -type f -name "*.apk" -print

          DEBUG_APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" | head -1)

          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" release/QGM-debug.apk
          fi

          RELEASE_APK=$(find app/build/outputs/apk/release \
            -type f -name "*.apk" 2>/dev/null | head -1 || true)

          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" release/QGM-release.apk
          fi

      - name: Export Public Certificate PEM
        if: ${{ env.HAS_KEYSTORE != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -exportcert \
            -rfc \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file release/QGM-signing-certificate.pem

          test -s release/QGM-signing-certificate.pem

      - name: Verify APK
        if: ${{ env.HAS_KEYSTORE != '' }}
        shell: bash
        run: |
          APK="release/QGM-release.apk"

          test -f "$APK"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
            verify \
            --verbose \
            "$APK"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QGM-Android-Release
          path: release/
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.apk
            release/*.pem
