name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ✅ PERBAIKI GRADLE WRAPPER (GENERATE FILE JAR RESMI)
        run: |
          cd /tmp
          # Download Gradle 8.9 resmi
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          cd /home/runner/work/QGM/QGM
          
          # ⚡ COMMAND RESMI — buat ulang wrapper + JAR yang BENAR!
          /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --no-daemon
          
          # Cek hasil — ukuran JAR harus benar!
          ls -la gradle/wrapper/
          
          # Tes apakah berjalan
          ./gradlew --version --no-daemon

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builds
          path: artifacts/*.apk
