name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission
        run: |
          chmod +x ./gradlew
          ls -la gradle/wrapper/

      - name: ✅ BUAT GRADLE WRAPPER RESMI (FIX FILE JAR)
        run: |
          # Download gradle 8.9 binary & generate proper wrapper JAR
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          cd /home/runner/work/QGM/QGM
          # Ganti file JAR rusak dengan yang RESMI dari gradle 8.9
          cp /tmp/gradle-8.9/lib/gradle-wrapper-8.9.jar gradle/wrapper/gradle-wrapper.jar
          # Atau pakai command resmi gradle wrapper
          /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --no-daemon
          # Cek ukuran — HARUS 65536 bytes!
          ls -la gradle/wrapper/
          ./gradlew --version --no-daemon

      - name: Clean
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builds
          path: artifacts/*.apk
