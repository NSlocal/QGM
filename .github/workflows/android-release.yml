name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew clean --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Decode release keystore
        if: ${{ env.HAS_KEYSTORE != '' }}
        shell: bash
        run: |
          echo "$HAS_KEYSTORE" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build signed release APK
        if: ${{ env.HAS_KEYSTORE != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release

          cp app/build/outputs/apk/debug/app-debug.apk \
            release/QGM-debug.apk

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
              release/QGM-release.apk
          fi

      - name: Export public certificate PEM
        if: ${{ env.HAS_KEYSTORE != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          keytool -exportcert \
            -rfc \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file release/QGM-signing-certificate.pem

          test -s release/QGM-signing-certificate.pem

      - name: Create certificate information
        if: ${{ env.HAS_KEYSTORE != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          keytool -list \
            -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > release/certificate-info.txt

          sed -i '/PrivateKeyEntry/d' release/certificate-info.txt || true

      - name: Verify APK
        shell: bash
        run: |
          ls -lh release/

          if [ -f release/QGM-release.apk ]; then
            apksigner verify --verbose release/QGM-release.apk
          else
            echo "Signed release APK not generated; debug APK is available."
          fi

      - name: Upload APK and certificate
        uses: actions/upload-artifact@v4
        with:
          name: QGM-Android-Release
          path: release/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/QGM-*.apk
            release/QGM-signing-certificate.pem
            release/certificate-info.txt
