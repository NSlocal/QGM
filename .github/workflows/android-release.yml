name: Buat Certificate & Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ✅ BUAT KEYSTORE + CERT + PEM + ZIP
        run: |
          # Buat folder kerja
          mkdir -p cert-output
          cd cert-output

          # === 1. Buat Keystore .jks ===
          keytool -genkeypair -v \
            -keystore app-release-key.jks \
            -alias release-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass QGMstore123 \
            -keypass QGMkey123 \
            -dname "CN=QGM, O=NSlocal, L=Pekanbaru, ST=Riau, C=ID" \
            -sigalg SHA256withRSA

          # === 2. Export PEM Certificate ===
          keytool -exportcert -alias release-key -keystore app-release-key.jks \
            -storepass QGMstore123 -rfc -file release-cert.pem

          # === 3. Export CER Certificate ===
          keytool -exportcert -alias release-key -keystore app-release-key.jks \
            -storepass QGMstore123 -file release-cert.cer

          # === 4. Buat ZIP Semua ===
          zip QGM-Certificate-Package.zip release-cert.pem release-cert.cer app-release-key.jks

          ls -la

      - name: 📦 Upload ZIP Hasil
        uses: actions/upload-artifact@v4
        with:
          name: QGM-Certificate-Full
          path: cert-output/QGM-Certificate-Package.zip
