name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle Wrapper files
        shell: bash
        run: |
          set -eux

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          ls -lh gradlew
          ls -lh gradle/wrapper/
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Download Gradle 8.9
        shell: bash
        run: |
          curl -fL \
            --retry 3 \
            --retry-all-errors \
            -o /tmp/gradle-8.9-bin.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -t /tmp/gradle-8.9-bin.zip >/dev/null
          echo "Gradle 8.9 distribution OK"

      - name: Check Wrapper
        shell: bash
        run: |
          set -eux
          ./gradlew --version --no-daemon --stacktrace

      - name: Clean
        shell: bash
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --info

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec cp {} release/ \;

          ls -lah release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QGM-debug
          path: release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.apk
