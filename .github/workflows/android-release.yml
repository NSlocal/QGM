name: Buat Certificate & Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java + OpenSSL
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ✅ BUAT PKCS12 (.p12) — CERT + KEY DALAM 1 FILE!
        run: |
          mkdir -p cert-output
          cd cert-output

          # 1. Buat Keystore JKS
          keytool -genkeypair -v \
            -keystore app-release-key.jks \
            -alias release-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass QGMstore123 \
            -keypass QGMkey123 \
            -dname "CN=QGM, O=NSlocal, L=Pekanbaru, ST=Riau, C=ID" \
            -sigalg SHA256withRSA

          # 2. EXPORT JADI PKCS12 — 1 FILE BERISI CERT + PRIVATE KEY! ✅
          keytool -importkeystore \
            -srckeystore app-release-key.jks -srcstoretype jks -srcstorepass QGMstore123 -srcalias release-key \
            -destkeystore QGM-CERT-KEY.p12 -deststoretype pkcs12 -deststorepass QGMstore123 -destkeypass QGMkey123

          # 3. Juga export cert terpisah untuk CA
          keytool -exportcert -alias release-key -keystore app-release-key.jks \
            -storepass QGMstore123 -file QGM-CA-ONLY.cer

          # 4. ZIP SEMUA
          zip QGM-CERT-FULL.zip QGM-CERT-KEY.p12 QGM-CA-ONLY.cer app-release-key.jks
          ls -la
          echo "✅ FILE .p12 SUDAH JADI! Password: QGMstore123"

      - name: 📦 Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: QGM-CERT-FULL-PACKAGE
          path: cert-output/QGM-CERT-FULL.zip
