name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Wrapper
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          cd $GITHUB_WORKSPACE
          /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --no-daemon

      - name: Restore Keystore from Secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > app/app-release-key.jks
          ls -la app/

      - name: Set Execute Permission
        run: chmod +x gradlew

      - name: Clean Project
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (Signed)
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Collect APK Files
        run: |
          mkdir -p outputs
          find app/build/outputs/apk -name "*.apk" -exec cp {} outputs/ \;
          ls -la outputs/

      - name: Upload APK Builds
        uses: actions/upload-artifact@v4
        with:
          name: QGM-APK-RELEASE
          path: outputs/*.apk

      - name: Cleanup Keystore
        if: always()
        run: rm -f app/app-release-key.jks
